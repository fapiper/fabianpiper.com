name: Deploy www to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/www/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/fetch-vault-secrets
        id: vault

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: apps/www
        run: bun install

      - name: Build
        working-directory: apps/www
        run: |
          set -euo pipefail
          SECRET_FILE="${{ steps.vault.outputs.secret_file }}"
          set -a && . "$SECRET_FILE" && set +a
          PUBLIC_SITE_URL="${SITE_URL:-}" \
          PUBLIC_MIXPANEL_TOKEN="${MIXPANEL_TOKEN:-}" \
          bun run build

      - name: Deploy to Cloudflare Pages
        working-directory: apps/www
        run: bunx wrangler pages deploy dist/ --project-name=www --branch=main

      - name: Cleanup Secrets File
        if: always()
        run: |
          SECRET_FILE="${{ steps.vault.outputs.secret_file }}"
          if [ -f "$SECRET_FILE" ]; then
            shred -vfz -n 3 "$SECRET_FILE" 2>/dev/null || rm -f "$SECRET_FILE"
          fi
